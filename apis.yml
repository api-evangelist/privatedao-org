- aid: privatedao-org:blind-policy-verification-api
  name: PrivateDAO Blind Policy Verification API
  description: Prove that a private policy (e.g. a credit-capacity rule over private records, risk score and liabilities)
    was satisfied without revealing the inputs. Groth16 proofs over the private_dao_blind_policy_overlay circuit;
    endpoints for status, a safe sample payload, prove, verify (hash recompute + expiry check) and an on-chain Solana
    receipt.
  humanURL: https://privatedao.org/developers/blind-policy-api/
  baseURL: https://api.privatedao.org/api/v1
