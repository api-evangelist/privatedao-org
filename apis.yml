apis:
- aid: privatedao-org:agent-exchange-api
  name: PrivateDAO Agent Exchange API
  description: Machine-native verification, evidence and agent-workflow services on Solana mainnet. Discover services,
    create jobs (two free, twelve paid per job in USDC with a quote-first 402 payment_intent flow), submit payment
    signatures, fetch receipts, register and search agents, publish marketplace listings, and create agreements.
    The same job engine is exposed as an A2A agent (/a2a) and a hosted MCP server (/mcp).
  humanURL: https://privatedao.org/agents/
