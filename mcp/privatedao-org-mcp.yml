summary: 'PrivateDAO hosts one remote MCP server on the Agent Exchange host. An anonymous initialize returns
  protocolVersion 2025-03-26, serverInfo pdao-agent-exchange 1.1.0 and capabilities {tools:{}}; tools/list
  returns 11 tools. Every tool ships an EMPTY inputSchema ({type: object, additionalProperties: false})
  and a placeholder description ("PrivateDAO <tool_name>"), so the server is reachable but its tools are
  not self-describing - an agent must read the OpenAPI/service catalog (see mcp/privatedao-org-tool-crosswalk.yml)
  to know what to send.'
deployment:
  mode: remote
  endpoint: https://agents.privatedao.org/mcp
  auth: none
  verified: probed
  note: 'Hosted HTTPS endpoint an MCP client POSTs to directly; no stdio package, no npx/uvx install documented
    anywhere. Unauthenticated: paid tools return the same 402 payment_intent flow as the REST API rather
    than requiring a credential.'
server:
  name: pdao-agent-exchange
  transport: http
  url: https://agents.privatedao.org/mcp
  probe:
    method: POST initialize; POST tools/list
    http_status: 200
    protocol_version: '2025-03-26'
    server_version: 1.1.0
    fetched: '2026-09-19'
    get_behaviour: GET /mcp returns the A2A Agent Card JSON (200) rather than an SSE stream
tools:
- name: exchange_overview
  description: 'Start here. Explain the PrivateDAO Agent Exchange as a service economy for AI agents:
    discover a capability, request it, receive a quote when paid, execute read-only evidence work, and
    verify the receipt.'
- name: pdao_services
  description: Return the complete current catalog with service IDs, customer value, category, pricing,
    inputs, outputs, target networks and payment behavior.
  input_schema:
    type: object
    additionalProperties: false
  input_schema_note: empty as served
  crosswalk: mcp/privatedao-org-tool-crosswalk.yml
- name: product_catalog
  description: Return the current product packages with buyer, price, included services, target networks
    and exact batch checkout path.
- name: service_recommendation
  description: Map a natural-language task to the best available PrivateDAO services. Use this before
    create_paid_job when the user has not named a service ID.
- name: provider_integrations
  description: Explain what IBM watsonx, Intel OpenVINO, MongoDB, GitHub, ChatGPT, Claude, Grok, OpenClaw
    and the PrivateDAO Kernel add to the ecosystem, with relationship disclosures and safe provider status.
- name: payment_guide
  description: Explain the quote-first Solana Mainnet USDC payment flow. Never infer an amount, never
    pay before a payment_intent, and never request a private key.
- name: execution_guide
  description: Explain how to create a free or paid job, interpret 402 payment_intent, submit finalized
    payment proof, poll status, retrieve a receipt and verify it.
