openapi: 3.2.0
info:
  title: Privatedao Org Jobs API
  version: 1.3.0
  description: 'Operations tagged Jobs across 2 of this provider''s published API definitions: privatedao-org-agent-exchange-openapi.json, privatedao-org-agent-exchange-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://agents.privatedao.org
tags:
- name: Jobs
paths:
  /api/jobs:
    post:
      operationId: createJob
      tags:
      - Jobs
      summary: Create job
      x-summary-source: derived
    servers:
    - url: https://agents.privatedao.org
  /api/jobs/{jobId}:
    get:
      operationId: jobStatus
      tags:
      - Jobs
      summary: Job status
      x-summary-source: derived
    servers:
    - url: https://agents.privatedao.org
  /api/jobs/{jobId}/payment:
    post:
      operationId: submitPayment
      tags:
      - Jobs
      summary: Submit payment
      x-summary-source: derived
    servers:
    - url: https://agents.privatedao.org
x-refined-from:
- privatedao-org-agent-exchange-openapi.json
- privatedao-org-agent-exchange-openapi.yml
