  on privatedao.org, www.privatedao.org, agents.privatedao.org (the MCP and A2A host) and api.privatedao.org, 2026-09-19.
  Every row is a request that was issued; every status is the one returned.
summary:
  hosts_probed: 4
  paths_probed: 56
  documents_served: 4
  note: 'Two real documents: an RFC 9116 security.txt served identically on privatedao.org and api.privatedao.org,
    and an A2A Agent Card on agents.privatedao.org at both the canonical and legacy paths. No OAuth/OIDC discovery
    anywhere - the APIs are unauthenticated and paid per job in USDC - and no RFC 9728 protected-resource metadata
    on the MCP host, which returns a real JSON 404 for every other well-known path. privatedao.org and api.privatedao.org
    are one Next.js deployment that answers 200 text/html for every unknown path, so every non-security.txt row
    on those hosts is a soft-404 and is marked real_document: false. www.privatedao.org 301s to the apex.'
