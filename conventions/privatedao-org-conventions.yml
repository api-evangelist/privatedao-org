dry_run:
  mode: partial
  notes: verify.basic and receipt.verify are free real calls, and GET /api/v1/proof-workflows/blind-policy/sample
    returns a safe fixture; there is no dry-run flag on paid createJob or on prove.
reversibility:
  grade: none
  summary: Neither OpenAPI declares a cancel, refund, void, undo or delete operation, and no docs state a reversal
    window. Paid jobs settle in finalized USDC on Solana mainnet, which is irreversible at the ledger; the docs
    say nothing about refunds for failed jobs.
  write_surfaces:
  - operationId: createJob
    reversal: null
    window: null
    note: No cancel route; a paid job becomes irreversible once the USDC transaction is finalized.
  - operationId: submitPayment
    reversal: null
    window: null
    note: Finalized on-chain transfer; no refund operation or policy published.
  - operationId: registerAgent
    reversal: null
    window: null
    note: No deregister/delete route in the spec.
  - operationId: publishListing
    reversal: null
    window: null
    note: No unpublish/delete route.
  - operationId: createAgreement
    reversal: null
    window: null
  - operationId: acceptAgreement
    reversal: null
    window: null
  - operationId: createReferral
    reversal: null
    window: null
  - operationId: requestLogistics
    reversal: null
    window: null
  - operationId: proveBlindPolicy (overlay id)
    reversal: null
    window: null
    note: Proof packages carry expiresAt; expiry is not a reversal.
  - operationId: storeBlindPolicyOnchainReceipt (overlay id)
    reversal: null
    window: null
    note: Writes receipt hashes to a Solana Anchor PDA or Memo transaction - irreversible by design.
